# PTS-01 - Payload Tray Sorting
#
# Live demo build: 7-step procedure for SIH26174.  No vial, no rack_slot,
# no SAMPLE_TRANSFER step.  Props are the only physical objects scored.
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  LIVE DEMO SPATIAL CONTRACT  (image / camera coordinates)           ║
# ║                                                                      ║
# ║  Camera: fixed top-down (or slight down-angle). Do NOT move after   ║
# ║  zone calibration.  All zone boxes are in IMAGE coordinates, i.e.   ║
# ║  LEFT in the image = camera-left, RIGHT in image = camera-right.    ║
# ║  Operator "left"/"right" may differ — always use image coords here. ║
# ║                                                                      ║
# ║  Physical layout (as seen in the camera image):                     ║
# ║                                                                      ║
# ║   [ zone_blue / BLUE place-pad ]  [ TRAY ]  [ zone_red / RED pad ] ║
# ║      camera-LEFT                  CENTER      camera-RIGHT           ║
# ║                                                                      ║
# ║  Start state: tray_lid resting ON the tray with a visible dark rim  ║
# ║  of the tray showing around the lid edge — required for step 1      ║
# ║  (tray detection needs the dark rim, not just the yellow lid).      ║
# ║                                                                      ║
# ║  OPEN_TRAY: slide the lid horizontally clear of tray_slot; pause    ║
# ║  ~1 s IN FRAME outside the tray_slot footprint before releasing,    ║
# ║  so hold_frames=8 completes before the lid leaves frame.            ║
# ║                                                                      ║
# ║  Canonical extraction order (correct run):                          ║
# ║    1. Slide lid off tray.                                            ║
# ║    2. Pick red_box → place on RIGHT pad (zone_red).                 ║
# ║    3. Pick blue_box → place on LEFT pad (zone_blue).                ║
# ║                                                                      ║
# ║  Wrong-order demo: after lid open, complete BLUE placement before   ║
# ║  RED — validator emits OUT_OF_ORDER then SKIPPED.                   ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# CONVENTIONS
#   * All boxes below are NORMALISED fractions of frame width/height, i.e.
#     [x1, y1, x2, y2] with values in 0..1. har/protocol/spec.py resolves them
#     to pixels into contracts.Zone.box. Zones must be defined by the rack
#     overlay at runtime; the values here are the default desk layout.
#   * `predicate` names are a frozen vocabulary implemented by Track A in
#     har/protocol/predicates.py. An unknown name is a load-time error.
#   * `target` refers to an entry in `objects`; `zone` refers to a Zone id.
#   * `hold_frames` is how many consecutive *video* frames the predicate must
#     hold before the step is declared complete. A later step uses its own
#     `hold_frames` before a skip is declared (DEVELOPMENT_PLAN.md A4 rules 2&4),
#     so a small value on the action steps also hardens skip detection against a
#     single dropped/spurious frame.
#
# THRESHOLD TUNING (step A6, Track A)
#   Calibrated for a 15 fps camera (the validator's hold logic counts true
#   video frames via `frame_index`, so these numbers are frame-rate, not
#   wall-clock, dependent).  Tuned with `tools/tune_thresholds.py` against the
#   recorded evidence (the A1 fixtures, and the densified/dropout stress sweep
#   that emulates A8's real footage):
#     * Action steps (hoi_cycle) use hold_frames=4 so a one-frame detector
#       dropout on the *current* object + a one-frame spurious read on a *later*
#       object cannot false-trigger OUT_OF_ORDER/SKIPPED. 4 frames (~0.27 s)
#       still completes on real footage (the released object is held in its
#       zone) and stays within the recorded evidence's satisfied span.
#     * Dwell steps (object_stable / settled / hands_clear) keep generous holds
#       (15-30 frames = 1-2 s) that survive the colour detector's burst dropouts
#       under median-of-N smoothing (config/colours.yaml, B2).
#   Thresholds live here, never in code — retune under venue lighting without
#   touching Python.
#
# PREDICATE VOCABULARY (frozen)
#   object_stable(label)              present, measured, centre in rack ROI, low movement
#   object_left_zone(label, zone)     present and centre outside zone
#   hoi_cycle(label, zone)            NEAR -> PICKED_UP -> CARRYING -> RELEASED, release inside zone
#   settled(label, zone)              centre inside zone and stationary for hold_frames
#   transfer(src, dst, zone)          picked from src, released inside zone (unused in this 7-step build)
#   hands_clear(zone)                 wrists were seen inside zone earlier this run and
#                                     none is inside now, for hold_frames (an empty
#                                     scene with no hands ever seen is NOT clear)

protocol_id: PTS-01
title: Payload Tray Sorting & Sample Transfer
version: "1.0.0"

objects:
  - tray
  - tray_lid
  - red_box
  - blue_box

zones:
  - id: rack_roi
    label: Payload rack work envelope (most of the white sheet)
    box: [0.08, 0.15, 0.92, 0.95]

  - id: tray_slot
    # Tight footprint around the tray's rest position.
    # Start state: lid ON tray with dark rim visible → tray detection fires.
    # OPEN_TRAY requires lid centre to leave this box (slide horizontally).
    label: Tray stow position
    box: [0.34, 0.48, 0.66, 0.88]

  - id: zone_red
    # *** camera-RIGHT placement pad — red_box final home ***
    # x ∈ [0.70, 0.90]: right half of a typical top-down frame.
    # Must NOT overlap tray_slot (x starts at 0.70 > tray_slot x2 0.66).
    # Calibrate so the centre of the placed red_box falls well inside.
    label: Red box placement pad (camera-right)
    box: [0.70, 0.50, 0.90, 0.80]

  - id: zone_blue
    # *** camera-LEFT placement pad — blue_box final home ***
    # x ∈ [0.10, 0.30]: left half of a typical top-down frame.
    # Must NOT overlap tray_slot (x ends at 0.30 < tray_slot x1 0.34).
    # Calibrate so the centre of the placed blue_box falls well inside.
    label: Blue box placement pad (camera-left)
    box: [0.10, 0.50, 0.30, 0.80]

steps:
  - step_id: PRESENT_TRAY
    index: 1
    title: Present the payload tray
    instruction: Place the outer tray inside the rack work envelope and let it settle.
    predicate: object_stable(tray)
    target: tray
    zone: rack_roi
    hold_frames: 15
    timeout_s: 60
    voice_prompt: Step 1. Present the payload tray in the rack envelope.

  - step_id: OPEN_TRAY
    index: 2
    title: Open the tray
    # Slide — do NOT lift — the lid horizontally until its centre leaves
    # tray_slot.  Keep the lid in frame for ~1 s (hold_frames=8 at 15 fps)
    # before releasing so the predicate completes while the lid is visible.
    instruction: Slide the tray lid clear of the tray slot.
    predicate: object_left_zone(tray_lid, tray_slot)
    target: tray_lid
    zone: tray_slot
    requires: [PRESENT_TRAY]
    hold_frames: 8
    timeout_s: 60
    voice_prompt: Step 2. Slide the tray lid clear of the tray.

  - step_id: EXTRACT_RED
    index: 3
    title: Extract the red box
    # Place red_box on the RIGHT pad (zone_red, camera-right of tray).
    instruction: Pick the red box out of the tray and place it on the right pad.
    predicate: hoi_cycle(red_box, zone_red)
    target: red_box
    zone: zone_red
    requires: [OPEN_TRAY]
    hold_frames: 4
    timeout_s: 90
    voice_prompt: Step 3. Move the red box to the right pad.
    voice_alert: Step 3 skipped. The red box must go to the right pad before the blue box.

  - step_id: VERIFY_RED_PLACED
    index: 4
    title: Verify red box placement
    instruction: Confirm the red box is stationary inside the right pad.
    predicate: settled(red_box, zone_red)
    target: red_box
    zone: zone_red
    requires: [EXTRACT_RED]
    hold_frames: 30
    timeout_s: 30
    voice_prompt: Step 4. Confirm the red box is seated on the right pad.

  - step_id: EXTRACT_BLUE
    index: 5
    title: Extract the blue box
    # Place blue_box on the LEFT pad (zone_blue, camera-left of tray).
    instruction: Pick the blue box out of the tray and place it on the left pad.
    predicate: hoi_cycle(blue_box, zone_blue)
    target: blue_box
    zone: zone_blue
    requires: [VERIFY_RED_PLACED]
    hold_frames: 4
    timeout_s: 90
    voice_prompt: Step 5. Move the blue box to the left pad.
    voice_alert: Out of sequence. The red box must be placed on the right pad before the blue box.

  - step_id: VERIFY_BLUE_PLACED
    index: 6
    title: Verify blue box placement
    instruction: Confirm the blue box is stationary inside the left pad.
    predicate: settled(blue_box, zone_blue)
    target: blue_box
    zone: zone_blue
    requires: [EXTRACT_BLUE]
    hold_frames: 30
    timeout_s: 30
    voice_prompt: Step 6. Confirm the blue box is seated on the left pad.

  - step_id: STOW_AND_CLOSE
    index: 7
    title: Clear the work envelope
    instruction: Withdraw both hands from the rack work envelope.
    predicate: hands_clear(rack_roi)
    target: tray_lid
    zone: rack_roi
    requires: [VERIFY_BLUE_PLACED]
    hold_frames: 20
    timeout_s: 60
    voice_prompt: Step 7. Clear both hands from the work envelope.
    # voice_alert is what the validator speaks when this step is satisfied
    # *early* (OUT_OF_ORDER while an earlier step is still current), so it
    # must describe that situation.  It is never a "hands still inside"
    # message: while step 7 is current and hands are still in the envelope
    # the predicate is simply unsatisfied (voice_prompt keeps instructing;
    # the 60 s timeout_s produces its own "Step 7 timed out" alert).
    voice_alert: "Out of sequence: work envelope was cleared before earlier steps finished."
