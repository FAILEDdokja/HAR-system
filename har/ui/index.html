<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIH26174 · HAR console</title>
<!-- Everything on this page is local: no CDN, no fonts, no network.
     The system must run in airplane mode — and so must its GUI. -->
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --line: #2c3644;
    --text: #e8edf3; --muted: #8b98a9; --ok: #3fb96b; --accent: #4db2e8;
    --warn: #e8a23f; --bad: #e84545; --badbg: #c23535;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: .4px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .badge {
    padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    letter-spacing: .6px; background: var(--panel2); border: 1px solid var(--line);
  }
  .badge.in-progress { color: var(--accent); border-color: var(--accent); }
  .badge.complete    { color: var(--ok);     border-color: var(--ok); }
  .badge.not-started { color: var(--muted); }
  .badge.violation   { color: #fff; background: var(--bad); border-color: var(--bad); }
  .stat { color: var(--muted); font-size: 13px; }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1 1 auto; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel2);
    color: var(--text); font: 600 13px/1 inherit; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; letter-spacing: .3px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-reset { border-color: var(--bad); color: #ffd7d7; }
  .btn-reset:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
  main {
    display: grid; grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr);
    gap: 14px; padding: 14px 20px 20px;
  }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .video-wrap { overflow: hidden; }
  .video-wrap .title, .col .title {
    padding: 9px 14px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    color: var(--muted); border-bottom: 1px solid var(--line);
  }
  #stream { display: block; width: 100%; background: #05070a; min-height: 220px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  #alert {
    display: none; padding: 12px 14px; border-radius: 10px;
    background: var(--badbg); color: #fff; font-weight: 700; font-size: 15px;
    box-shadow: 0 0 24px rgba(226, 69, 69, .35); animation: pulse 1.1s infinite;
  }
  #alert.on { display: block; }
  @keyframes pulse { 50% { filter: brightness(1.25); } }
  #next-card { padding: 10px 14px 12px; }
  #next-card .kicker { font-size: 11px; color: var(--muted); letter-spacing: 1px; font-weight: 700; }
  #next { font-size: 16px; margin-top: 3px; }
  #steps { list-style: none; }
  #steps li {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 9px 14px; border-bottom: 1px solid var(--line);
  }
  #steps li:last-child { border-bottom: none; }
  #steps .idx {
    flex: 0 0 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
    background: var(--panel2); color: var(--muted); font-weight: 700; font-size: 12px;
  }
  #steps .name { font-weight: 600; font-size: 14px; }
  #steps .instr { color: var(--muted); font-size: 12.5px; }
  #steps li.current { background: rgba(77, 178, 232, .10); border-left: 3px solid var(--accent); }
  #steps li.current .idx { background: var(--accent); color: #06131c; }
  #steps li.done { opacity: .85; }
  #steps li.done .idx { background: var(--ok); color: #06130c; }
  #steps li.done .name { color: var(--ok); }
  #steps li.skipped .idx, #steps li.violation .idx { background: var(--bad); color: #fff; }
  #steps li.violation .name { color: var(--bad); }
  #log {
    list-style: none; max-height: 240px; overflow-y: auto;
    font: 12px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  #log li { padding: 2px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log li .t { color: var(--muted); }
  #log li .ev-ok { color: var(--ok); }
  #log li .ev-info { color: var(--accent); }
  #log li .ev-bad { color: var(--bad); font-weight: 700; }
  footer { padding: 0 20px 14px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="proto-title">HAR console</h1>
    <div class="sub" id="proto-sub">SIH26174 · offline activity recognition</div>
  </div>
  <span class="badge not-started" id="state">CONNECTING</span>
  <span class="stat">elapsed <b id="trel">0.0 s</b></span>
  <span class="stat">fps <b id="fps">–</b></span>
  <span class="stat">contract <b id="contract">–</b></span>
  <span class="spacer"></span>
  <button id="btn-reset" class="btn btn-reset" type="button"
          title="Reset the experiment sequence back to step 1 (idle) without restarting the app, camera or models. Clears current step, violations and timers.">
    ⟳ Restart / Reset
  </button>
</header>

<main>
  <section class="card video-wrap">
    <div class="title">LIVE PAYLOAD CAMERA</div>
    <img id="stream" src="/stream" alt="live stream">
  </section>

  <section class="col">
    <div id="alert" role="alert"></div>

    <div class="card" id="next-card">
      <div class="kicker">NEXT INSTRUCTION</div>
      <div id="next">Waiting for the run to start…</div>
    </div>

    <div class="card">
      <div class="title">PROTOCOL CHECKLIST</div>
      <ol id="steps"></ol>
    </div>

    <div class="card">
      <div class="title">EVENT LOG</div>
      <ol id="log"></ol>
    </div>
  </section>
</main>

<footer>Stream: <code>/stream</code> · Status polled at 2 Hz · Log at 1 Hz · fully offline</footer>

<script>
"use strict";
let protocol = null;   // /protocol payload (step table), null when unbound
let lastStatus = null;

const $ = (id) => document.getElementById(id);

async function fetchJSON(url) {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(url + " -> " + r.status);
  return r.json();
}

function stateBadge(st) {
  const el = $("state");
  el.textContent = st.state.replace(/_/g, " ");
  el.className = "badge";
  if (st.violations && st.violations.length) el.classList.add("violation");
  else if (st.state === "COMPLETE") el.classList.add("complete");
  else if (st.state === "IN_PROGRESS") el.classList.add("in-progress");
  else el.classList.add("not-started");
}

function renderAlert(st) {
  const el = $("alert");
  if (st.violations && st.violations.length && st.last_alert) {
    el.textContent = "⚠ " + st.last_alert;
    el.classList.add("on");
  } else {
    el.classList.remove("on");
  }
}

function renderNext(st) {
  const el = $("next");
  if (st.state === "COMPLETE") { el.textContent = "Protocol complete."; return; }
  if (st.next_instruction) { el.textContent = st.next_instruction; return; }
  el.textContent = st.state === "NOT_STARTED"
    ? "Waiting for the run to start…" : "Awaiting next step…";
}

function stepRow(step, idx, st) {
  const li = document.createElement("li");
  const id = step ? step.step_id : "";
  const done = st.completed && st.completed.includes(id);
  const skipped = st.skipped && st.skipped.includes(id);
  const viol = st.violations && st.violations.includes(id);
  const current = id && id === st.current_step_id && st.state !== "COMPLETE";
  if (done) li.className = "done";
  if (skipped) li.className = "skipped";
  if (viol) li.className = "violation";
  if (current) li.className = (li.className ? li.className + " " : "") + "current";
  const mark = done ? "✓" : (skipped || viol) ? "✕" : String(idx);
  li.innerHTML =
    '<span class="idx">' + mark + "</span>" +
    '<span><div class="name">' + (step ? (idx + ". " + escapeHTML(step.title)) : "Step " + idx) + "</div>" +
    (step ? '<div class="instr">' + escapeHTML(step.instruction) + "</div>" : "") +
    "</span>";
  return li;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g,
    (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

function renderSteps(st) {
  const ol = $("steps");
  ol.innerHTML = "";
  if (protocol && protocol.steps) {
    protocol.steps.forEach((s) => ol.appendChild(stepRow(s, s.index, st)));
    return;
  }
  // Degraded view without /protocol: show what the status alone knows.
  const seen = [];
  (st.completed || []).forEach((id) => seen.push({step_id: id, title: id, instruction: ""}));
  if (st.current_step_id) seen.push({step_id: st.current_step_id, title: st.current_step_id, instruction: ""});
  if (st.next_step_id)     seen.push({step_id: st.next_step_id,     title: st.next_step_id,     instruction: st.next_instruction});
  seen.forEach((s, i) => ol.appendChild(stepRow(s, i + 1, st)));
}

function evClass(e) {
  if (e.status === "VIOLATION") return "ev-bad";
  if (e.event === "COMPLETED" || e.event === "PROTOCOL_COMPLETE") return "ev-ok";
  return "ev-info";
}

async function pollStatus() {
  try {
    const st = await fetchJSON("/status");
    lastStatus = st;
    $("proto-title").textContent = st.protocol_id + " — " + st.protocol_title;
    $("trel").textContent = Number(st.t_rel).toFixed(1) + " s";
    $("fps").textContent = Number(st.fps).toFixed(1);
    $("contract").textContent = st.contract_version;
    stateBadge(st);
    renderAlert(st);
    renderNext(st);
    renderSteps(st);
  } catch (err) { /* stream starting up; try again next tick */ }
}

async function doReset() {
  const btn = $("btn-reset");
  btn.disabled = true;
  btn.textContent = "Restarting…";
  try {
    const r = await fetch("/reset", {method: "POST", cache: "no-store"});
    if (!r.ok) throw new Error("/reset -> " + r.status);
    await r.json();
    // The main loop applies the reset between frames; the next /status poll
    // will show the run back at step 1 (NOT_STARTED / idle).  Log the action
    // straight into the event log tail so there is immediate feedback.
    pollEvents();
  } catch (err) {
    console.error("reset failed", err);
    alert("Restart failed: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "⟳ Restart / Reset";
  }
}

async function pollEvents() {
  try {
    const events = await fetchJSON("/events?n=30");
    const ol = $("log");
    ol.innerHTML = "";
    events.slice().reverse().forEach((e) => {
      const li = document.createElement("li");
      li.innerHTML = '<span class="t">' + Number(e.t_rel).toFixed(2).padStart(8, " ") +
        '</span> <span class="' + evClass(e) + '">' + e.event.padEnd(17, " ") + "</span> " +
        escapeHTML(e.step_id) + (e.message ? " — " + escapeHTML(e.message) : "");
      ol.appendChild(li);
    });
  } catch (err) { /* ignore */ }
}

(async function boot() {
  try { protocol = await fetchJSON("/protocol"); } catch (err) { protocol = null; }
  if (protocol) $("proto-sub").textContent =
    "SIH26174 · " + protocol.protocol_id + " v" + protocol.version + " · offline";
  $("btn-reset").addEventListener("click", doReset);
  pollStatus(); pollEvents();
  setInterval(pollStatus, 500);   // 2 Hz
  setInterval(pollEvents, 1000);  // 1 Hz
})();
</script>
</body>
</html>
