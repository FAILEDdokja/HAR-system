# SIH26174 HAR — container deployment.
#
#   docker compose up -d                        # demo replay + GUI on :8080
#   docker compose --profile camera up -d       # live webcam (needs /dev/video0)
#   docker compose logs -f
#   docker compose down
#
# Artefacts (events.jsonl, events.csv, meta.json, recordings/) are written to
# /data — a Docker-managed named volume `har-runs` by default, which sidesteps
# bind-mount ownership on Windows Docker Desktop.  Set HAR_DATA_DIR=./runs (or
# any absolute path) to use a host bind mount instead.  Every variable below
# has a working default; see .env.example and docs/DEPLOYMENT.md.

x-har: &har
  build:
    context: .
    args:
      # cpu keeps the ~2.5 GB of NVIDIA wheels out of the image; see the
      # Dockerfile header and tools/docker_requirements.py.
      TORCH_CHANNEL: ${TORCH_CHANNEL:-cpu}
      TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
  image: sih26174-har:${TORCH_CHANNEL:-cpu}
  restart: unless-stopped
  # The CLI runs daemon threads (GUI server, TTS worker); give it a real PID 1.
  init: true
  # A named volume is initialised with /data owned by uid 1001 (the image's
  # user), so the defaults work everywhere.  Override HAR_UID/HAR_GID only for
  # a bind mount whose host directory is owned by different ids.
  user: "${HAR_UID:-1001}:${HAR_GID:-1001}"
  environment:
    HAR_OUT_DIR: /data/${HAR_RUN_NAME:-latest}
    HAR_STREAM_PORT: "8080"
    HAR_EXTRA_ARGS: ${HAR_EXTRA_ARGS:-}
  ports:
    - "${HAR_HOST_PORT:-8080}:8080"
  volumes:
    # Named volume by default (see the `volumes:` block below); set
    # HAR_DATA_DIR=./runs for a bind mount on the host filesystem.
    - ${HAR_DATA_DIR:-har-runs}:/data
  # The app finalises the recording and closes the event log on SIGTERM;
  # give it time before compose escalates to SIGKILL.
  stop_grace_period: 30s

services:
  # Default: the demo that cannot fail — replay the shipped footage in a loop,
  # record it, and serve the monitoring GUI.  No camera, no GPU required.
  har:
    <<: *har
    command: ["--source", "demo/correct.mp4", "--loop", "--record"]

  # Live camera.  Opt in with: docker compose --profile camera up -d har-camera
  # /dev/video0 must exist on the host; if permission is denied, run the
  # container as a host user in the `video` group (HAR_UID/HAR_GID) or add
  # `group_add: ["video"]` below.
  har-camera:
    <<: *har
    profiles: ["camera"]
    devices:
      - /dev/video0:/dev/video0
    command: ["--source", "0", "--record"]

volumes:
  # Run artefacts live here when HAR_DATA_DIR is left at its default.  Docker
  # manages the volume, so there is no host path to own and no bind-mount
  # permission problem on Windows Docker Desktop; a brand-new volume is
  # initialised with /data's image contents (owned by uid 1001).  Persists
  # across `docker compose down`; remove with `docker compose down -v`.
  har-runs:
